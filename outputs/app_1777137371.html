<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchpad</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: #f3f4f6;
  height: 100vh;
  display: flex;
  overflow: hidden;
  color: #1f2937;
}
.sidebar {
  width: 240px;
  background: #ffffff;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 24px;
  overflow-y: auto;
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
}
.sidebar h1 { font-size: 18px; font-weight: 600; color: #111827; margin-bottom: 4px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; font-weight: 600; margin-bottom: 8px; }
.tools { display: flex; flex-direction: column; gap: 6px; }
.tool-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: #374151;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
.tool-btn:hover { background: #f3f4f6; }
.tool-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
.tool-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.props { display: flex; flex-direction: column; gap: 12px; }
label { font-size: 13px; color: #4b5563; }
input[type="color"] {
  width: 100%; height: 36px; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; background: none;
}
input[type="range"] { width: 100%; }
.size-display { font-size: 12px; color: #6b7280; text-align: right; margin-top: 2px; }
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.btn {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
  background: #ffffff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #374151;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
.btn:hover { background: #f9fafb; border-color: #d1d5db; }
.btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.btn-primary:hover { background: #1d4ed8; }
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
}
canvas {
  background: #ffffff;
  border-radius: 8px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  cursor: crosshair;
  touch-action: none;
  max-width: 100%;
  max-height: 100%;
}
</style>
</head>
<body>
<div class="sidebar">
  <div>
    <h1>Sketchpad</h1>
  </div>
  <div>
    <div class="section-title">Tools</div>
    <div class="tools">
      <button class="tool-btn active" data-tool="pen"><span class="tool-icon">✏️</span> Pen</button>
      <button class="tool-btn" data-tool="eraser"><span class="tool-icon">🧼</span> Eraser</button>
      <button class="tool-btn" data-tool="line"><span class="tool-icon">╱</span> Line</button>
      <button class="tool-btn" data-tool="rect"><span class="tool-icon">▭</span> Rectangle</button>
      <button class="tool-btn" data-tool="circle"><span class="tool-icon">○</span> Circle</button>
    </div>
  </div>
  <div>
    <div class="section-title">Properties</div>
    <div class="props">
      <div>
        <label>Color</label>
        <input type="color" id="colorPicker" value="#000000">
      </div>
      <div>
        <label>Size</label>
        <input type="range" id="sizeSlider" min="1" max="50" value="3">
        <div class="size-display" id="sizeDisplay">3px</div>
      </div>
    </div>
  </div>
  <div class="actions">
    <div class="section-title">Actions</div>
    <button class="btn" id="undoBtn">↩ Undo</button>
    <button class="btn" id="redoBtn">↪ Redo</button>
    <button class="btn" id="clearBtn">✕ Clear</button>
    <button class="btn btn-primary" id="saveBtn">⬇ Save</button>
  </div>
</div>
<div class="main" id="main">
  <canvas id="canvas"></canvas>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const main = document.getElementById('main');
const colorPicker = document.getElementById('colorPicker');
const sizeSlider = document.getElementById('sizeSlider');
const sizeDisplay = document.getElementById('sizeDisplay');

let currentTool = 'pen';
let isDrawing = false;
let startX, startY;
let snapshot;
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 50;

function resizeCanvas() {
  const rect = main.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (undoStack.length === 0) {
    saveState();
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function saveState() {
  if (undoStack.length >= MAX_HISTORY) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = [];
}

function undo() {
  if (undoStack.length <= 1) return;
  redoStack.push(undoStack.pop());
  ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
}

function redo() {
  if (redoStack.length === 0) return;
  const data = redoStack.pop();
  undoStack.push(data);
  ctx.putImageData(data, 0, 0);
}

function startDraw(e) {
  isDrawing = true;
  const pos = getPos(e);
  startX = pos.x;
  startY = pos.y;
  ctx.lineWidth = sizeSlider.value;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = colorPicker.value;
    ctx.fillStyle = colorPicker.value;
  }
  if (currentTool === 'pen' || currentTool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  } else {
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function draw(e) {
  if (!isDrawing) return;
  const pos = getPos(e);
  if (currentTool === 'pen' || currentTool === 'eraser') {
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  } else {
    ctx.putImageData(snapshot, 0, 0);
    ctx.beginPath();
    if (currentTool === 'line') {
      ctx.moveTo(startX, startY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } else if (currentTool === 'rect') {
      ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
    } else if (currentTool === 'circle') {
      const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
      ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
      ctx.stroke();
    }
  }
}

function stopDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  saveState();
}

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
  });
});

sizeSlider.addEventListener('input', () => {
  sizeDisplay.textContent = sizeSlider.value + 'px';
});

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveState();
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'sketch.png';
  link.href = canvas.toDataURL();
  link.click();
});

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseout', stopDraw);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) startDraw(e.touches[0]);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) draw(e.touches[0]);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  stopDraw();
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
});

resizeCanvas();
</script>
</body>
</html>
