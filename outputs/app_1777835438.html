<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Overdrive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(16px);
    z-index: 20;
    transition: opacity 0.3s;
  }
  .screen.hidden { display: none !important; }
  .screen h1 {
    font-size: clamp(2.2rem, 9vw, 5.5rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00f3ff, #ff00aa 60%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.2em;
    filter: drop-shadow(0 0 25px rgba(0,243,255,0.4));
  }
  .screen h2 { font-size: clamp(1.6rem, 7vw, 3.2rem); color: #00f3ff; margin-bottom: 0.6em; text-shadow: 0 0 20px rgba(0,243,255,0.5); }
  .screen p { color: #bbb; margin-bottom: 2em; font-size: 1.15rem; max-width: 400px; text-align: center; line-height: 1.5; }
  .stats { text-align: center; margin-bottom: 2em; color: #ddd; font-size: 1.1rem; line-height: 1.8; }
  .stats span { color: #00f3ff; font-weight: 800; }

  button {
    background: transparent; border: 2px solid #00f3ff; color: #00f3ff;
    padding: 14px 40px; font-size: 1.05rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    cursor: pointer; margin: 8px;
    border-radius: 6px;
    transition: all 0.18s ease;
    box-shadow: 0 0 12px rgba(0,243,255,0.15);
    min-width: 220px;
  }
  button:hover {
    background: #00f3ff; color: #000;
    box-shadow: 0 0 28px rgba(0,243,255,0.6);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0) scale(0.98); }
  button.secondary { border-color: #ff00aa; color: #ff00aa; box-shadow: 0 0 12px rgba(255,0,170,0.15); }
  button.secondary:hover { background: #ff00aa; color: #fff; box-shadow: 0 0 28px rgba(255,0,170,0.5); }

  .hint { margin-top: 2.2em; color: #666; font-size: 0.85rem; letter-spacing: 0.05em; text-align: center; line-height: 1.6; }

  .hud {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 18px 22px;
  }
  .hud.hidden { display: none !important; }
  .hud-top, .hud-bottom { display: flex; justify-content: space-between; gap: 14px; pointer-events: none; }
  .hud-box {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 110px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .hud-box span { display: block; font-size: 0.6rem; color: #999; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 2px; }
  .hud-box .value { font-size: 1.5rem; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .hud-box small { font-size: 0.7rem; color: #888; margin-left: 2px; }
  #hudTime { color: #00f3ff; }
  #hudSpeed { color: #ff00aa; font-size: 2.2rem; }
  .bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar-fill { height: 100%; width: 100%; border-radius: 3px; transition: width 0.1s linear; background: #00f3ff; box-shadow: 0 0 8px rgba(0,243,255,0.4); }

  .msg {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(1.6rem, 6vw, 3.5rem); font-weight: 900; color: #fff;
    text-shadow: 0 0 30px rgba(0,243,255,0.9), 0 0 60px rgba(0,243,255,0.4);
    opacity: 0; transition: opacity 0.25s; pointer-events: none; text-align: center; white-space: nowrap;
  }

  .touch-controls {
    position: absolute; bottom: 24px; left: 0; width: 100%;
    display: none; justify-content: space-between; padding: 0 24px;
    z-index: 15; pointer-events: auto;
  }
  .touch-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    width: 84px; height: 84px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: rgba(255,255,255,0.7);
    touch-action: manipulation;
    user-select: none;
  }
  .touch-btn:active { background: rgba(0,243,255,0.18); border-color: #00f3ff; color: #00f3ff; transform: scale(0.95); }
  @media (pointer: coarse) { .touch-controls { display: flex; } }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="startScreen" class="screen">
  <h1>Neon Overdrive</h1>
  <p>A synthwave time-trial racer. Beat the clock. Outrun the grid.</p>
  <button id="btnStart">Start Engine</button>
  <div class="hint">
    Arrows / WASD &middot; Drive & Steer<br>
    Space &middot; Nitro Boost<br>
    Esc / P &middot; Pause
  </div>
</div>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-box"><span>Score</span><div id="hudScore" class="value">0</div></div>
    <div class="hud-box"><span>Time</span><div id="hudTime" class="value">60.0</div></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hud-bottom">
    <div class="hud-box"><span>Speed</span><div id="hudSpeed" class="value">0</div><small>km/h</small></div>
    <div class="hud-box"><span>Nitro</span><div class="bar"><div id="nitroBar" class="bar-fill"></div></div></div>
    <div class="hud-box"><span>Next Check</span><div id="hudCheck" class="value">1000m</div></div>
  </div>
</div>

<div id="pauseScreen" class="screen hidden">
  <h2>Paused</h2>
  <button id="btnResume">Resume</button>
  <button id="btnRestart" class="secondary">Restart</button>
  <button id="btnQuit">Quit to Menu</button>
</div>

<div id="gameOverScreen" class="screen hidden">
  <h2>Time Up</h2>
  <div class="stats">
    <div>SCORE &nbsp;<span id="finalScore">0</span></div>
    <div>BEST &nbsp;&nbsp;&nbsp;<span id="bestScore">0</span></div>
  </div>
  <button id="btnRestartGO">Race Again</button>
  <button id="btnQuitGO" class="secondary">Main Menu</button>
</div>

<div class="touch-controls" id="touchControls">
  <div class="touch-btn" data-key="ArrowLeft">←</div>
  <div style="display:flex;gap:12px;">
    <div class="touch-btn" data-key="ArrowDown">B</div>
    <div class="touch-btn" data-key="ArrowUp">A</div>
  </div>
  <div class="touch-btn" data-key="ArrowRight">→</div>
</div>

<script>
/* ============================
   NEON OVERDRIVE
   Single-file pseudo-3D racer
   ============================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

/* Constants */
const FPS = 60;
const STEP = 1 / FPS;
const SEGMENT_LENGTH = 200;
const RUMBLE_LENGTH = 4;
const ROAD_WIDTH = 2000;
const LANES = 3;
const FOV = 100;
const CAMERA_HEIGHT = 1000;
const CAMERA_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const DRAW_DISTANCE = 300;
const CAMERA_DIST = 3000;
const MAX_SPEED = SEGMENT_LENGTH * 60; // 12000
const ACCEL = MAX_SPEED / 4;
const BREAKING = -MAX_SPEED;
const DECEL = -MAX_SPEED / 5;
const OFF_ROAD_DECEL = -MAX_SPEED / 2;
const OFF_ROAD_LIMIT = MAX_SPEED / 3;
const CENTRIFUGAL = 0.35;
const CHECKPOINT_EVERY = 8000;

/* Palette */
const COL = {
  skyT: '#080618', skyM: '#1e1a4d', skyB: '#2a1040',
  sun: '#ff00cc',
  grassD: '#070712', grassL: '#0d0d1f',
  roadD: '#111', roadL: '#161616',
  rumbleD: '#00f3ff', rumbleL: '#ff00aa',
  lane: 'rgba(255,255,255,0.35)'
};

/* State */
let segments = [];
let cars = [];
let particles = [];
let playerX = 0;
let playerZ = 0;
let speed = 0;
let score = 0;
let raceTime = 60;
let nitro = 100;
let shake = 0;
let state = 'MENU'; // MENU | COUNTDOWN | PLAYING | PAUSED | GAMEOVER
let countdown = 0;
let countMsg = '';
let bestScore = +localStorage.getItem('neon_best') || 0;
let attractZ = 0;
let steerInput = 0;
let lastTime = 0;
let accTime = 0;
let musicTick = 0;

/* Audio Engine */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.engine = null;
    this.engineGain = null;
  }
  ensure() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.35;
    this.master.connect(this.ctx.destination);
  }
  startEngine() {
    this.ensure();
    if (this.engine) return;
    this.engine = this.ctx.createOscillator();
    this.engineGain = this.ctx.createGain();
    this.engine.type = 'sawtooth';
    this.engine.frequency.value = 50;
    this.engineGain.gain.value = 0;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 800;
    this.engine.connect(f);
    f.connect(this.engineGain);
    this.engineGain.connect(this.master);
    this.engine.start();
  }
  setEngine(speedPct) {
    if (!this.engine) return;
    const f = 60 + speedPct * 220;
    this.engine.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.12);
    this.engineGain.gain.setTargetAtTime(0.1 + speedPct * 0.25, this.ctx.currentTime, 0.12);
  }
  beep(freq, type, dur, vol = 0.2) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g).connect(this.master);
    o.start();
    o.stop(this.ctx.currentTime + dur);
  }
  coin() { this.beep(880, 'square', 0.08); setTimeout(() => this.beep(1320, 'square', 0.18, 0.15), 80); }
  crash() { this.beep(90, 'sawtooth', 0.35, 0.3); }
  nitro() { this.beep(300, 'sawtooth', 0.4, 0.15); this.beep(600, 'sawtooth', 0.6, 0.1); }
  tick() { this.beep(440, 'triangle', 0.05, 0.05); }
}
const audio = new AudioEngine();

/* Input */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Escape' || e.code === 'KeyP') && (state === 'PLAYING' || state === 'PAUSED')) togglePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.querySelectorAll('.touch-btn').forEach(btn => {
  const code = btn.dataset.key;
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[code] = false; });
  btn.addEventListener('touchcancel', e => { keys[code] = false; });
});

/* Utils */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function easeIn(a, b, p) { return a + (b - a) * p * p; }
function easeOut(a, b, p) { return a + (b - a) * (1 - (1 - p) * (1 - p)); }
function easeInOut(a, b, p) { return a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* Road Generation */
let lastY = 0;
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n,
    p1: { world: { x: 0, y: lastY, z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
    p2: { world: { x: 0, y: y, z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
    curve, sprites: [], color: {}
  });
  lastY = y;
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY;
  const endY = startY + Math.floor(y) * SEGMENT_LENGTH;
  const total = enter + hold + leave;
  let n;
  for (n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}
function addStraight(n) { addRoad(n, n, n, 0, 0); }
function addCurve(enter, hold, leave, curve, y) { addRoad(enter, hold, leave, curve, y); }
function addHill(enter, hold, leave, curve, y) { addRoad(enter, hold, leave, curve, y); }

function resetRoad() {
  segments = [];
  lastY = 0;
  addStraight(50);
  addHill(40, 40, 40, 0, 2500);
  addCurve(40, 60, 40, 2, 0);
  addHill(40, 40, 40, 0, -1500);
  addCurve(40, 60, 40, -2, 1500);
  addStraight(60);
  addCurve(60, 80, 60, 3, 0);
  addHill(40, 60, 40, 0, 2000);
  addCurve(40, 60, 40, -3, -2000);
  addStraight(80);
  addCurve(60, 80, 60, -2, 1000);
  addHill(40, 40, 40, 0, -1000);
  addStraight(100);

  // colorize
  for (let n = 0; n < segments.length; n++) {
    const dark = Math.floor(n / RUMBLE_LENGTH) % 2 === 0;
    segments[n].color = {
      grass: dark ? COL.grassD : COL.grassL,
      road: dark ? COL.roadD : COL.roadL,
      rumble: dark ? COL.rumbleD : COL.rumbleL,
      lane: (n < RUMBLE_LENGTH * 2) ? null : COL.lane
    };
  }

  // sprites
  for (let n = 30; n < segments.length - 30; n++) {
    if (Math.abs(segments[n].curve) > 0.5) continue;
    if (Math.random() < 0.06) {
      const off = Math.random() < 0.5 ? -(1.5 + Math.random() * 0.8) : (1.5 + Math.random() * 0.8);
      segments[n].sprites.push({ type: Math.random() < 0.7 ? 'tree' : (Math.random() < 0.5 ? 'rock' : 'sign'), offset: off });
    }
  }
}

function findSegment(z) {
  return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
}

/* Projection */
function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = CAMERA_DEPTH / p.camera.z;
  p.screen.x = Math.round((W / 2) + (p.screen.scale * p.camera.x * W / 2));
  p.screen.y = Math.round((H / 2) - (p.screen.scale * p.camera.y * H / 2));
  p.screen.w = Math.round(p.screen.scale * ROAD_WIDTH * W / 2);
}

/* Cars */
function resetCars() {
  cars = [];
  const totalLen = segments.length * SEGMENT_LENGTH;
  for (let i = 0; i < 22; i++) {
    const offset = -0.7 + Math.random() * 1.4;
    const z = 3000 + Math.random() * totalLen * 0.8;
    const s = MAX_SPEED * (0.35 + Math.random() * 0.35);
    const col = ['#ff0055', '#ffaa00', '#00ff88', '#ffffff'][Math.floor(Math.random() * 4)];
    cars.push({ x: offset, z, speed: s, color: col });
  }
}

function updateCars(dt) {
  for (const car of cars) {
    car.z += car.speed * dt;
    if (Math.random() < 0.008) {
      car.x += (Math.random() - 0.5) * 0.4;
      car.x = clamp(car.x, -0.9, 0.9);
    }
    const len = segments.length * SEGMENT_LENGTH;
    if (car.z > len) car.z -= len;
    if (car.z < 0) car.z += len;
  }
}

function checkCollisions() {
  for (const car of cars) {
    const dz = car.z - playerZ;
    if (dz > 80 && dz < 350) {
      const dx = Math.abs(playerX - car.x);
      if (dx < 0.32) {
        speed *= 0.25;
        shake = 25;
        spawnParticles(W / 2, H - 140, 30, '#ffaa00');
        spawnParticles(W / 2, H - 140, 15, '#fff');
        audio.crash();
        showMessage('CRASH!');
      } else if (dx < 0.6 && dz < 220 && speed > car.speed + 1500) {
        score += 300;
        showMessage('NEAR MISS +300');
        audio.coin();
      }
    }
  }
}

/* Particles */
function spawnParticles(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 300,
      vy: (Math.random() - 0.5) * 300 - 50,
      life: 1.0,
      col
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2.5;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

/* Drawing helpers */
function drawPoly(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}

function drawBackground() {
  // Sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, COL.skyT);
  g.addColorStop(0.55, COL.skyM);
  g.addColorStop(1, COL.skyB);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sy = H * 0.58;
  ctx.fillStyle = COL.sun;
  ctx.beginPath();
  ctx.arc(W / 2, sy, Math.min(140, W * 0.18), 0, Math.PI * 2);
  ctx.fill();

  // Sun stripes
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(W / 2 - 200, sy - 70 + i * 32, 400, 10);
  }

  // Mountains parallax
  const off = (playerX * ROAD_WIDTH * 0.015) % W;
  ctx.fillStyle = '#0b0318';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= W + 50; i += 40) {
    const h = Math.abs(Math.sin((i + off) * 0.008)) * 60 + Math.abs(Math.sin((i + off) * 0.02)) * 30 + 40;
    ctx.lineTo(i, H * 0.62 - h);
  }
  ctx.lineTo(W, H);
  ctx.fill();
}

function drawSprite(sp, x, y, s) {
  const sc = 1000 * s;
  if (sp.type === 'tree') {
    ctx.fillStyle = '#1f0f3a';
    ctx.beginPath(); ctx.arc(x, y - sc * 1.4, sc * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#140820';
    ctx.fillRect(x - sc * 0.08, y - sc * 1.4, sc * 0.16, sc * 1.4);
  } else if (sp.type === 'rock') {
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x, y - sc * 0.5, sc * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (sp.type === 'sign') {
    ctx.fillStyle = '#333';
    ctx.fillRect(x - sc * 0.04, y - sc, sc * 0.08, sc);
    ctx.fillStyle = '#ff00aa';
       ctx.fillRect(x - sc * 0.35, y - sc * 1.1, sc * 0.7, sc * 0.45);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(8, sc * 0.22)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('NEON', x, y - sc * 0.82);
  }
}

function drawCarSprite(car, x, y, s) {
  const sc = 900 * s;
  const w = sc * 0.5;
  const h = sc * 0.28;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(x - w * 0.5 + sc * 0.02, y - sc * 0.06, w, h, sc * 0.04);
  ctx.fill();

  // Body
  ctx.fillStyle = car.color || '#fff';
  roundRect(x - w * 0.5, y - sc * 0.14 - h * 0.5, w, h, sc * 0.04);
  ctx.fill();

  // Roof / window
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(x - w * 0.28, y - sc * 0.18 - h * 0.5, w * 0.56, h * 0.55, sc * 0.02);
  ctx.fill();

  // Taillights
  ctx.fillStyle = '#ff0033';
  ctx.fillRect(x - w * 0.42, y - sc * 0.14 - h * 0.52, w * 0.12, h * 0.18);
  ctx.fillRect(x + w * 0.30, y - sc * 0.14 - h * 0.52, w * 0.12, h * 0.18);

  // Glow
  ctx.shadowColor = car.color || '#fff';
  ctx.shadowBlur = 12 * s;
  ctx.strokeStyle = car.color || '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawPlayer() {
  const x = W / 2;
  const y = H - 120;
  const sc = 1.0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(x - 45 + 4, y + 12, 90, 24, 6);
  ctx.fill();

  // Body
  ctx.fillStyle = '#00f3ff';
  roundRect(x - 44, y - 28, 88, 34, 6);
  ctx.fill();

  // Roof
  ctx.fillStyle = '#004455';
  roundRect(x - 26, y - 46, 52, 22, 4);
  ctx.fill();

  // Windshield
  ctx.fillStyle = '#111';
  roundRect(x - 22, y - 42, 44, 12, 2);
  ctx.fill();

  // Headlights
  ctx.fillStyle = '#00f3ff';
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 16;
  ctx.fillRect(x - 38, y - 26, 10, 6);
  ctx.fillRect(x + 28, y - 26, 10, 6);
  ctx.shadowBlur = 0;

  // Engine stripes
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 6, y - 28, 12, 34);

  // Brake lights when slowing
  if (keys['ArrowDown'] || keys['KeyS']) {
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 10;
    ctx.fillRect(x - 38, y + 2, 10, 4);
    ctx.fillRect(x + 28, y + 2, 10, 4);
    ctx.shadowBlur = 0;
  }
}

function render() {
  // Camera
  const camZ = playerZ - CAMERA_DIST;
  const baseSeg = findSegment(playerZ);
  const basePercent = (playerZ % SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const camY = CAMERA_HEIGHT + baseSeg.p1.world.y + easeInOut(baseSeg.p1.world.y, baseSeg.p2.world.y, basePercent);
  const camX = playerX * ROAD_WIDTH;

  // Screen shake
  let ox = 0, oy = 0;
  if (shake > 0) {
    ox = (Math.random() - 0.5) * shake;
    oy = (Math.random() - 0.5) * shake;
    shake *= 0.9;
    if (shake < 0.5) shake = 0;
  }

  ctx.save();
  ctx.translate(ox, oy);

  drawBackground();

  let maxY = H;
  let n;

  for (n = 0; n < DRAW_DISTANCE; n++) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    const looped = seg.index < baseSeg.index;
    seg.p1.camera.z = (n * SEGMENT_LENGTH) - (basePercent * SEGMENT_LENGTH);
    if (looped) seg.p1.camera.z += segments.length * SEGMENT_LENGTH;
    seg.p2.camera.z = seg.p1.camera.z + SEGMENT_LENGTH;

    project(seg.p1, camX, camY, camZ);
    project(seg.p2, camX, camY, camZ);

    if (seg.p1.camera.z <= CAMERA_DEPTH || seg.p2.screen.y >= maxY || seg.p2.screen.y >= seg.p1.screen.y) continue;

    drawPoly(0, seg.p1.screen.y, W, seg.p1.screen.y, W, seg.p2.screen.y, 0, seg.p2.screen.y, seg.color.grass);
    drawPoly(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y,
             seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y, seg.p2.screen.x, seg.p2.screen.y, seg.color.road);

    // Rumble strips
    const r1 = seg.p1.screen.w * 0.08;
    const r2 = seg.p2.screen.w * 0.08;
    drawPoly(seg.p1.screen.x - r1, seg.p1.screen.y, seg.p1.screen.x, seg.p1.screen.y,
             seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.x - r2, seg.p2.screen.y, seg.color.rumble);
    drawPoly(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y, seg.p1.screen.x + seg.p1.screen.w + r1, seg.p1.screen.y,
             seg.p2.screen.x + seg.p2.screen.w + r2, seg.p2.screen.y, seg.p2.screen.x + seg.p2.screen.w, seg.p2.screen.y, seg.color.rumble);

    // Lane markers
    if (seg.color.lane) {
      const l1 = seg.p1.screen.w / LANES;
      const l2 = seg.p2.screen.w / LANES;
      const laneW1 = l1 * 0.02;
      const laneW2 = l2 * 0.02;
      for (let lane = 1; lane < LANES; lane++) {
        const lx1 = seg.p1.screen.x + l1 * lane - laneW1 / 2;
        const lx2 = seg.p2.screen.x + l2 * lane - laneW2 / 2;
        drawPoly(lx1, seg.p1.screen.y, lx1 + laneW1, seg.p1.screen.y,
                 lx2 + laneW2, seg.p2.screen.y, lx2, seg.p2.screen.y, seg.color.lane);
      }
    }

    maxY = seg.p2.screen.y;
  }

  // Sprites from far to near
  for (n = DRAW_DISTANCE - 1; n >= 0; n--) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    for (const sp of seg.sprites) {
      const spriteScale = seg.p1.screen.scale;
      const spriteX = seg.p1.screen.x + (spriteScale * sp.offset * ROAD_WIDTH * W / 2);
      const spriteY = seg.p1.screen.y;
      drawSprite(sp, spriteX, spriteY, spriteScale);
    }

    // Traffic cars
    for (const car of cars) {
      const carSeg = findSegment(car.z);
      if (carSeg.index !== seg.index) continue;
      const carScale = seg.p1.screen.scale;
      const carX = seg.p1.screen.x + (carScale * car.x * ROAD_WIDTH * W / 2);
      const carY = seg.p1.screen.y;
      drawCarSprite(car, carX, carY, carScale);
    }
  }

  // Particles
  drawParticles();

  // Player
  drawPlayer();

  // Speed lines when fast
  if (speed > MAX_SPEED * 0.82) {
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.12)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const sx = Math.random() * W;
      const sy = Math.random() * H * 0.4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy + 40 + Math.random() * 80);
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* Game Logic */
let msgTimer = 0;
function showMessage(txt) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.style.opacity = '1';
  msgTimer = 1.2;
}

function updateHUD() {
  document.getElementById('hudScore').textContent = Math.floor(score);
  document.getElementById('hudTime').textContent = Math.max(0, raceTime).toFixed(1);
  document.getElementById('hudSpeed').textContent = Math.floor((speed / MAX_SPEED) * 240);
  document.getElementById('nitroBar').style.width = nitro + '%';
  const nextCheck = Math.max(0, CHECKPOINT_EVERY - (score % CHECKPOINT_EVERY));
  document.getElementById('hudCheck').textContent = nextCheck < 1000 ? nextCheck + 'pts' : Math.floor(nextCheck / 1000 * 10) / 10 + 'k';
}

function resetGame() {
  resetRoad();
  resetCars();
  playerX = 0;
  playerZ = 0;
  speed = 0;
  score = 0;
  raceTime = 60;
  nitro = 100;
  shake = 0;
  particles = [];
  attractZ = 0;
  state = 'COUNTDOWN';
  countdown = 3;
  countMsg = '3';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('pauseScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  audio.startEngine();
  showMessage('READY');
  audio.tick();
}

function startCountdownStep() {
  countdown--;
  if (countdown === 2) { countMsg = '2'; showMessage('2'); audio.tick(); }
  else if (countdown === 1) { countMsg = '1'; showMessage('1'); audio.tick(); }
  else if (countdown === 0) { countMsg = 'GO!'; showMessage('GO!'); state = 'PLAYING'; audio.coin(); }
}

function endGame() {
  state = 'GAMEOVER';
  if (score > bestScore) {
    bestScore = Math.floor(score);
    localStorage.setItem('neon_best', bestScore);
  }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('bestScore').textContent = bestScore;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
}

function togglePause() {
  if (state === 'PLAYING') {
    state = 'PAUSED';
    document.getElementById('pauseScreen').classList.remove('hidden');
  } else if (state === 'PAUSED') {
    state = 'PLAYING';
    document.getElementById('pauseScreen').classList.add('hidden');
    lastTime = performance.now();
  }
}

function update(dt) {
  if (state === 'MENU') {
    attractZ += dt * 8000;
    if (attractZ > segments.length * SEGMENT_LENGTH) attractZ = 0;
    playerZ = attractZ;
    render();
    return;
  }

  if (state === 'COUNTDOWN') {
    render();
    return;
  }

  if (state === 'PAUSED') {
    render();
    return;
  }

  if (state === 'GAMEOVER') {
    render();
    return;
  }

  // INPUT
  const left = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const up = keys['ArrowUp'] || keys['KeyW'];
  const down = keys['ArrowDown'] || keys['KeyS'];
  const boost = keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'];

  steerInput = 0;
  if (left) steerInput = -1;
  if (right) steerInput = 1;

  // Physics
  const dx = dt * 2 * (speed / MAX_SPEED);
  if (steerInput !== 0) {
    playerX += steerInput * dx;
    if (speed > 0 && (left || right)) {
      // Tilt visual only handled in drawing if we wanted; here keep simple
    }
  }

  // Centrifugal force on curves
  const seg = findSegment(playerZ);
  playerX -= (dx * seg.curve * CENTRIFUGAL);

  // Acceleration
  if (up) speed += ACCEL * dt;
  else if (down) speed += BREAKING * dt;
  else speed += DECEL * dt;

  // Nitro boost
  if (boost && nitro > 0) {
    speed += ACCEL * 2.5 * dt;
    nitro -= dt * 45;
    if (nitro < 0) nitro = 0;
    if (Math.random() < 0.3) {
      spawnParticles(W / 2 + (Math.random() - 0.5) * 20, H - 80, 1, '#00f3ff');
    }
  } else {
    nitro = Math.min(100, nitro + dt * 6);
  }

  // Offroad
  if ((playerX < -1 || playerX > 1) && speed > OFF_ROAD_LIMIT) {
    speed += OFF_ROAD_DECEL * dt;
    shake = 3;
  }

  // Clamp
  speed = clamp(speed, 0, MAX_SPEED * (boost && nitro > 0 ? 1.25 : 1));
  playerX = clamp(playerX, -2.5, 2.5);

  // Position
  playerZ += speed * dt;
  const trackLen = segments.length * SEGMENT_LENGTH;
  while (playerZ >= trackLen) playerZ -= trackLen;

  // Scoring
  score += (speed / MAX_SPEED) * dt * 800;
  raceTime -= dt;

  // Checkpoint time bonus
  if (Math.floor(score / CHECKPOINT_EVERY) > Math.floor((score - (speed / MAX_SPEED) * dt * 800) / CHECKPOINT_EVERY)) {
    raceTime += 8;
    showMessage('+8 SECONDS');
    audio.coin();
  }

  // Game over
  if (raceTime <= 0) {
    raceTime = 0;
    endGame();
  }

  updateCars(dt);
  checkCollisions();
  updateParticles(dt);

  // Message fade
  if (msgTimer > 0) {
    msgTimer -= dt;
    if (msgTimer <= 0) document.getElementById('msg').style.opacity = '0';
  }

  // Audio engine pitch
  audio.setEngine(speed / MAX_SPEED);

  updateHUD();
  render();
}

/* Loop */
let accum = 0;
let cdAccum = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (state === 'COUNTDOWN') {
    cdAccum += dt;
    if (cdAccum >= 0.8) {
      cdAccum = 0;
      startCountdownStep();
    }
  }

  if (state === 'PLAYING' || state === 'MENU' || state === 'PAUSED' || state === 'GAMEOVER') {
    update(dt);
  }
}
