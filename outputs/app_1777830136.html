<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Circuit Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px;
  }
  #hud { display: none; width: 100%; justify-content: space-between; align-items: flex-start; }
  .hud-panel {
    background: rgba(10, 20, 40, 0.8); border: 1px solid rgba(100, 200, 255, 0.25);
    border-radius: 10px; padding: 10px 14px; color: #e0f0ff; text-shadow: 0 1px 0 rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  }
  .hud-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.8; margin-bottom: 4px; }
  .hud-value { font-size: 22px; font-weight: 700; }
  .hud-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  #speed-value { color: #7eeeff; }
  #lap-value { color: #ffd166; }
  #pos-value { color: #ff6b6b; }
  #nitro-bar-wrap { width: 140px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 6px; overflow: hidden; }
  #nitro-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00f2ff, #00ff9d); border-radius: 5px; transform-origin: left; transform: scaleX(1); transition: transform 0.1s linear; }

  #center-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  .card {
    background: rgba(12, 22, 40, 0.92); border: 1px solid rgba(100, 200, 255, 0.2); border-radius: 16px; padding: 32px 36px; max-width: 520px; width: 90%; text-align: center; color: #e6f2ff; box-shadow: 0 20px 60px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  }
  .card h1 { font-size: 32px; letter-spacing: 1px; margin-bottom: 8px; background: linear-gradient(90deg, #00f2ff, #7eeeff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card p { color: #b0c8e8; line-height: 1.55; margin-bottom: 18px; }
  .btn {
    display: inline-block; padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;
    background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; box-shadow: 0 6px 20px rgba(0,114,255,0.35); transition: transform 0.08s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0,114,255,0.45); }
  .btn:active { transform: translateY(0); }
  .keys { display: inline-flex; gap: 8px; justify-content: center; margin: 10px 0 6px; flex-wrap: wrap; }
  .key {
    min-width: 36px; height: 36px; line-height: 36px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #cfe6ff; font-weight: 700; font-size: 14px; padding: 0 10px;
  }
  .leaderboard { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .leaderboard th, .leaderboard td { padding: 8px 10px; text-align: left; }
  .leaderboard th { color: #7eeeff; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(100,200,255,0.2); }
  .leaderboard td { border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
  .lb-pos { width: 40px; color: #ffd166; font-weight: 800; }
  .lb-time { text-align: right; color: #a8c6e8; }
  .highlight-row td { color: #ffffff; font-weight: 700; }
  #minimap {
    position: absolute; bottom: 16px; right: 16px; width: 160px; height: 160px; border-radius: 10px; background: rgba(10, 20, 40, 0.8); border: 1px solid rgba(100, 200, 255, 0.25); pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap"></canvas>
<div id="ui">
  <div id="hud" style="display:none;">
    <div class="hud-panel">
      <div class="hud-title">Position</div>
      <div class="hud-value" id="pos-value">1 / 6</div>
    </div>
    <div class="hud-panel" style="text-align:center;">
      <div class="hud-title">Lap</div>
      <div class="hud-value" id="lap-value">1 / 3</div>
      <div class="hud-sub" id="time-text">0.00s</div>
    </div>
    <div class="hud-panel" style="text-align:right;">
      <div class="hud-title">Speed</div>
      <div class="hud-value"><span id="speed-value">0</span> <span style="font-size:14px;opacity:.7">km/h</span></div>
      <div id="nitro-bar-wrap"><div id="nitro-bar"></div></div>
      <div class="hud-sub">SPACE = Nitro</div>
    </div>
  </div>

  <div id="center-screen">
    <div id="start-card" class="card">
      <h1>Neon Circuit Racer</h1>
      <p>Race against 5 opponents on a glowing technical circuit. Complete 3 laps and finish in the top 3 to win.</p>
      <div class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></div>
      <div style="font-size:12px;color:#8aa8cc;margin-bottom:14px;">Or Arrow Keys to Drive &nbsp;&bull;&nbsp; SPACE for Nitro</div>
      <button class="btn" id="start-btn">Start Engine</button>
    </div>

    <div id="gameover-card" class="card" style="display:none;">
      <h1 id="go-title">Race Complete</h1>
      <p id="go-sub">Here are your results.</p>
      <table class="leaderboard" id="leaderboard">
        <thead><tr><th>Pos</th><th>Driver</th><th class="lb-time">Best Lap</th></tr></thead>
        <tbody id="lb-body"></tbody>
      </table>
      <button class="btn" id="restart-btn" style="margin-top:18px;">Race Again</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const startCard = document.getElementById('start-card');
  const gameoverCard = document.getElementById('gameover-card');
  const posVal = document.getElementById('pos-value');
  const lapVal = document.getElementById('lap-value');
  const speedVal = document.getElementById('speed-value');
  const timeText = document.getElementById('time-text');
  const nitroBar = document.getElementById('nitro-bar');
  const minimap = document.getElementById('minimap');
  const mCtx = minimap.getContext('2d');

  let W, H;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  minimap.width = 160; minimap.height = 160;

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') e.preventDefault(); });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function dist(a,b){ const dx=a[0]-b[0], dy=a[1]-b[1]; return Math.hypot(dx,dy); }
  function angle(a,b){ return Math.atan2(b[1]-a[1], b[0]-a[0]); }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]; }
  function normalize(v){ const d=Math.hypot(v[0],v[1]); return d>0?[v[0]/d,v[1]/d]:[0,0]; }

  function projectPointToSegment(p, a, b){
    const ab=[b[0]-a[0], b[1]-a[1]];
    const ap=[p[0]-a[0], p[1]-a[1]];
    const ab2=dot(ab,ab);
    if(ab2===0) return {t:0, closest:[a[0],a[1]], dist:Math.hypot(ap[0],ap[1])};
    let t=dot(ap,ab)/ab2;
    t=Math.max(0,Math.min(1,t));
    const closest=[a[0]+ab[0]*t, a[1]+ab[1]*t];
    return {t, closest, dist: Math.hypot(p[0]-closest[0], p[1]-closest[1])};
  }

  function closestTrackInfo(pos){
    let bestIdx=0, bestT=0, bestDist=Infinity, bestClose=[0,0];
    for(let i=0;i<waypoints.length;i++){
      const j=(i+1)%waypoints.length;
      const info=projectPointToSegment(pos, waypoints[i], waypoints[j]);
      if(info.dist<bestDist){ bestDist=info.dist; bestIdx=i; bestT=info.t; bestClose=info.closest; }
    }
    return {idx:bestIdx, t:bestT, dist:bestDist, closest:bestClose};
  }

  function addTrack(){
    const pts = [
      [400,600],[650,600],[900,550],[1150,450],[1300,300],[1200,150],[950,100],[650,120],[400,180],[200,300],[150,450],[250,550]
    ];
    function lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
    const smooth = [];
    for(let i=0;i<pts.length;i++){
      const p0 = pts[(i-1+pts.length)%pts.length];
      const p1 = pts[i];
      const p2 = pts[(i+1)%pts.length];
      const p3 = pts[(i+2)%pts.length];
      for(let t=0;t<1;t+=0.08){
        const tt=t*t, ttt=tt*t;
        const x = 0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*tt+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*ttt);
        const y = 0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*tt+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*ttt);
        smooth.push([x,y]);
      }
    }
    return smooth;
  }

  const waypoints = addTrack();
  const TRACK_WIDTH = 110;
  const TOTAL_LAPS = 3;

  class Car {
    constructor(name, color, isPlayer=false, startOffset=0){
      this.name=name; this.color=color; this.isPlayer=isPlayer; this.startOffset=startOffset;
      const sp = waypoints[0];
      const spNext = waypoints[1];
      const perp = angle(sp, spNext) + Math.PI/2;
      this.x = sp[0] + Math.cos(perp)*(startOffset*30);
      this.y = sp[1] + Math.sin(perp)*(startOffset*30);
      this.angle = angle(sp, spNext);
      this.speed = 0;
      this.maxSpeed = isPlayer? 9.2 : 8.0 + Math.random()*1.4;
      this.accel = isPlayer? 0.18 : 0.13 + Math.random()*0.05;
      this.turnSpeed = 0.045;
      this.friction = 0.985;
      this.offFriction = 0.94;
      this.nitro = 1;
      this.lap = 1;
      this.wp = 0;
      this.finished = false;
      this.finishTime = 0;
      this.bestLap = Infinity;
      this.lapStart = 0;
      this.totalRaceTime = 0;
      this.skids = [];
      this.aiOffset = (Math.random()-0.5)*0.6;
      this.aiTimer = Math.random()*60;
      this.width = 22; this.length = 38;
      this.lastAngle = this.angle;
      this.progress = 0;
      this.totalProgress = 0;
      this.nearEndPrev = false;
    }
    update(dt, raceTime){
      if(this.finished) return;
      if(this.isPlayer){
        const gas = (keys['ArrowUp']||keys['KeyW'])?1:(keys['ArrowDown']||keys['KeyS'])?-1:0;
        const steer = (keys['ArrowLeft']||keys['KeyA'])?-1:(keys['ArrowRight']||keys['KeyD'])?1:0;
        let boost = 1;
        if(keys['Space'] && this.nitro>0){ boost=1.55; this.nitro -= 0.006; if(this.nitro<0) this.nitro=0; }
        else { this.nitro += 0.001; if(this.nitro>1) this.nitro=1; }
        if(gas!==0) this.speed += gas*this.accel*boost;
        const steerFactor = Math.min(1, 3/(Math.abs(this.speed)+2));
        if(Math.abs(this.speed)>0.2) this.angle += steer*this.turnSpeed*steerFactor*Math.sign(this.speed);
        this.speed *= this.friction;
      } else {
        this.aiDrive();
      }

      const info = closestTrackInfo([this.x, this.y]);
      const onTrack = info.dist < TRACK_WIDTH*0.5 - 10;
      if(!onTrack) this.speed *= this.offFriction;

      this.x += Math.cos(this.angle)*this.speed;
      this.y += Math.sin(this.angle)*this.speed;

      if(Math.abs(this.speed)>4 && Math.abs(this.angle - this.lastAngle)>0.015){
        this.skids.push({x:this.x, y:this.y, life:1});
      }
      this.lastAngle = this.angle;
      for(let i=this.skids.length-1;i>=0;i--){ this.skids[i].life -= 0.015; if(this.skids[i].life<=0) this.skids.splice(i,1); }

      const now = closestTrackInfo([this.x, this.y]);
      if(now.idx !== this.wp){
        const forward = (this.wp+1)%waypoints.length;
        const backward = (this.wp-1+waypoints.length)%waypoints.length;
        if(now.idx === forward){ this.wp = now.idx; }
        else if(now.idx === backward){ this.wp = now.idx; }
        else { this.wp = now.idx; }
      }

      const segLen = [];
      for(let i=0;i<waypoints.length;i++){ const j=(i+1)%waypoints.length; segLen.push(dist(waypoints[i], waypoints[j])); }
      const totalLen = segLen.reduce((a,b)=>a+b,0);
      let progress = 0;
      for(let i=0;i<this.wp;i++) progress += segLen[i];
      progress += segLen[this.wp]*now.t;
      this.progress = progress / totalLen;
      this.totalProgress = (this.lap-1) + this.progress;

      if(this.wp===0 && now.t < 0.15 && this.nearEndPrev){
        const lapTime = raceTime - this.lapStart;
        if(lapTime>2000){
          if(lapTime < this.bestLap) this.bestLap = lapTime;
          this.lap++;
          this.lapStart = raceTime;
          if(this.lap > TOTAL_LAPS && !this.finished){ this.finished=true; this.finishTime=raceTime; }
        }
      }
      this.nearEndPrev = (this.wp === waypoints.length-1 && now.t > 0.7) || (this.wp===0 && now.t>0.8);
      this.totalRaceTime = raceTime;
    }
    aiDrive(){
      const lookahead = 4 + Math.floor(Math.random()*2);
      const targetIdx = (this.wp + lookahead) % waypoints.length;
      const target = waypoints[targetIdx];
      const nextIdx = (targetIdx+1)%waypoints.length;
      const tangent = normalize([waypoints[nextIdx][0]-target[0], waypoints[nextIdx][1]-target[1]]);
      const normal = [-tangent[1], tangent[0]];
      const offset = this.aiOffset * (TRACK_WIDTH*0.35);
      const tx = target[0] + normal[0]*offset;
      const ty = target[1] + normal[1]*offset;

      const desired = Math.atan2(ty-this.y, tx-this.x);
      let diff = desired - this.angle;
      while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
      const steer = Math.max(-1, Math.min(1, diff*2.5));
      const speedFactor = Math.min(1, 1/(Math.abs(diff)*2.5+0.8));
      const targetSpeed = this.maxSpeed * speedFactor;
      if(this.speed < targetSpeed) this.speed += this.accel; else this.speed -= this.accel*0.5;
      this.angle += steer * this.turnSpeed * 0.7;
      this.speed *= this.friction;
      const info = closestTrackInfo([this.x,this.y]);
      if(info.dist > TRACK_WIDTH*0.4) this.aiOffset *= 0.95;
      else { this.aiTimer++; if(this.aiTimer>120){ this.aiOffset += (Math.random()-0.5)*0.3; this.aiTimer=0; } }
    }
    draw(ctx){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(-this.length/2+3, -this.width/2+3, this.length, this.width);
      ctx.fillStyle=this.color;
      roundRect(ctx, -this.length/2, -this.width/2, this.length, this.width, 4);
      ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.35)';
      roundRect(ctx, -8, -7, 16, 14, 3);
      ctx.fill();
      ctx.fillStyle='#fff9c4';
      ctx.shadowColor='#fff9c4'; ctx.shadowBlur=8;
      ctx.fillRect(this.length/2-2, -this.width/2+3, 3, 5);
      ctx.fillRect(this.length/2-2, this.width/2-8, 3, 5);
      ctx.shadowBlur=0;
      ctx.fillStyle='#ff5252';
      ctx.shadowColor='#ff5252'; ctx.shadowBlur=6;
      ctx.fillRect(-this.length/2-1, -this.width/2+3, 2, 5);
      ctx.fillRect(-this.length/2-1, this.width/2-8, 2, 5);
      ctx.shadowBlur=0;
      if(this.isPlayer && keys['Space'] && this.nitro>0){
        ctx.fillStyle='#00f2ff';
        ctx.shadowColor='#00f2ff'; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.moveTo(-this.length/2, -4); ctx.lineTo(-this.length/2-12-Math.random()*8, 0); ctx.lineTo(-this.length/2, 4); ctx.fill();
        ctx.shadowBlur=0;
      }
      ctx.restore();
      for(const s of this.skids){
        ctx.globalAlpha=s.life*0.3;
        ctx.fillStyle='#1a2333';
        ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
      if(!this.isPlayer){
        ctx.font='11px Segoe UI, sans-serif';
        ctx.textAlign='center';
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.fillText(this.name, this.x, this.y - 28);
      }
    }
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
  }

  const opponentDefs = [
    {name:'Blaze', color:'#ff6b6b'}, {name:'Viper', color:'#ffd166'}, {name:'Shadow', color:'#9b5de5'},
    {name:'Frost', color:'#00bbf9'}, {name:'Rex', color:'#38b000'}
  ];

  let cars = [];
  let particles = [];
  let raceStart = 0;
  let raceTime = 0;
  let gameState = 'menu';
  let countdown = 3;
  let shake = 0;

  function resetGame(){
    cars = [];
    cars.push(new Car('You', '#00f2ff', true, 0));
    opponentDefs.forEach((d,i)=> cars.push(new Car(d.name, d.color, false, i+1)));
    particles = [];
    raceStart = 0; raceTime = 0; countdown=3; gameState='countdown';
    startCard.style.display='none'; gameoverCard.style.display='none'; hud.style.display='flex';
    cars.forEach(c=>{c.lapStart=0;});
    setTimeout(()=>{ if(gameState==='countdown') countdown=2; },800);
    setTimeout(()=>{ if(gameState==='countdown') countdown=1; },1600);
    setTimeout(()=>{ if(gameState==='countdown'){ countdown=0; gameState='racing'; raceStart=performance.now(); cars.forEach(c=>c.lapStart=0); } },2400);
  }

  function drawTrack(){
    ctx.fillStyle='#0f1a2e'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<waypoints.length;i++){
      const j=(i+1)%waypoints.length;
      const a=waypoints[i], b=waypoints[j];
      const ang = angle(a,b);
      const nx = Math.cos(ang+Math.PI/2), ny = Math.sin(ang+Math.PI/2);
      const hw = TRACK_WIDTH/2;
      ctx.beginPath();
      ctx.moveTo(a[0]+nx*hw, a[1]+ny*hw);
      ctx.lineTo(b[0]+nx*hw, b[1]+ny*hw);
      ctx.lineTo(b[0]-nx*hw, b[1]-ny*hw);
      ctx.lineTo(a[0]-nx*hw, a[1]-ny*hw);
      ctx.closePath();
      ctx.fillStyle='#1e2a45'; ctx.fill();
      ctx.strokeStyle='#2a3d5e'; ctx.lineWidth=2; ctx.stroke();
    }
    for(let i=0;i<waypoints.length;i++){
      const j=(i+1)%waypoints.length;
      const a=waypoints[i], b=waypoints[j];
      const ang = angle(a,b);
      const nx = Math.cos(ang+Math.PI/2), ny = Math.sin(ang+Math.PI/2);
      const hw = TRACK_WIDTH/2;
      const col = i%2===0?'#d00000':'#ffffff';
      ctx.beginPath(); ctx.moveTo(a[0]+nx*(hw+2), a[1]+ny*(hw+2)); ctx.lineTo(b[0]+nx*(hw+2), b[1]+ny*(hw+2)); ctx.lineTo(b[0]+nx*hw, b[1]+ny*hw); ctx.lineTo(a[0]+nx*hw, a[1]+ny*hw); ctx.closePath(); ctx.fillStyle=col; ctx.globalAlpha=0.7; ctx.fill(); ctx.globalAlpha=1;
      ctx.beginPath(); ctx.moveTo(a[0]-nx*(hw+2), a[1]-ny*(hw+2)); ctx.lineTo(b[0]-nx*(hw+2), b[1]-ny*(hw+2)); ctx.lineTo(b[0]-nx*hw, b[1]-ny*hw); ctx.lineTo(a[0]-nx*hw, a[1]-ny*hw); ctx.closePath(); ctx.fillStyle=col; ctx.globalAlpha=0.7; ctx.fill(); ctx.globalAlpha=1;
    }
    const s0=waypoints[0], s1=waypoints[1];
    const ang0=angle(s0,s1);
    const nx0=Math.cos(ang0+Math.PI/2), ny0=Math.sin(ang0+Math.PI/2);
    const hw0=TRACK_WIDTH/2;
    const cx=(s0[0]+s1[0])/2, cy=(s0[1]+s1[1])/2;
    for(let k=-3;k<=3;k++){
      const off=k*12;
      ctx.fillStyle=(k%2===0)?'#ffffff':'#000000';
      ctx.beginPath();
      ctx.moveTo(cx+nx0*off-ny0*hw0, cy+ny0*off+nx0*hw0);
      ctx.lineTo(cx+nx0*off+nx0*8-ny0*hw0, cy+ny0*off+ny0*8+nx0*hw0);
      ctx.lineTo(cx+nx0*off+nx0*8+ny0*hw0, cy+ny0*off+ny0*8-nx0*hw0);
      ctx.lineTo(cx+nx0*off+ny0*hw0, cy+ny0*off-nx0*hw0);
      ctx.closePath(); ctx.fill();
    }
    ctx.save();
    for(let i=0;i<waypoints.length;i++){
      const j=(i+1)%waypoints.length;
      const a=waypoints[i], b=waypoints[j];
      const dx=(b[0]-a[0]), dy=(b[1]-a[1]);
      const len=Math.hypot(dx,dy);
      const steps = Math.floor(len/30);
      for(let s=0;s<steps;s+=2){
        const t0=s/steps, t1=(s+1)/steps;
        const x1=a[0]+dx*t0, y1=a[1]+dy*t0;
        const x2=a[0]+dx*t1, y2=a[1]+dy*t1;
        ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; p.vx*=0.96; p.vy*=0.96;
      if(p.life<=0) particles.splice(i,1);
    }
  }
  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function spawnExhaust(car){
    if(Math.random()>0.6) return;
    const bx = car.x - Math.cos(car.angle)*car.length/2;
    const by = car.y - Math.sin(car.angle)*car.length/2;
    particles.push({x:bx+(Math.random()-0.5)*6, y:by+(Math.random()-0.5)*6, vx:(Math.random()-0.5)*1, vy:(Math.random()-0.5)*1, life:0.4+Math.random()*0.3, decay:0.015, size:2+Math.random()*3, color: car.isPlayer?'rgba(0,242,255,0.6)':'rgba(180,180,180,0.4)'});
  }

  function cameraFollow(car){
    const targetX = car.x - W/2;
    const targetY = car.y - H/2;
    if(cameraFollow.cx===undefined){ cameraFollow.cx=targetX; cameraFollow.cy=targetY; }
    cameraFollow.cx += (targetX - cameraFollow.cx)*0.12;
    cameraFollow.cy += (targetY - cameraFollow.cy)*0.12;
    return {x:cameraFollow.cx, y:cameraFollow.cy};
  }

  function drawMinimap(){
    mCtx.clearRect(0,0,160,160);
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const p of waypoints){ if(p[0]<minX)minX=p[0]; if(p[1]<minY)minY=p[1]; if(p[0]>maxX)maxX=p[0]; if(p[1]>maxY)maxY=p[1]; }
    const pad=20; const scaleX=(160-pad*2)/(maxX-minX); const scaleY=(160-pad*2)/(maxY-minY); const scale=Math.min(scaleX,scaleY);
    const offX=(160-(maxX-minX)*scale)/2 - minX*scale;
    const offY=(160-(maxY-minY)*scale)/2 - minY*scale;
    const tx=x=>x*scale+offX; const ty=y=>y*scale+offY;
    mCtx.strokeStyle='rgba(100,200,255,0.3)'; mCtx.lineWidth=8*scale; mCtx.lineCap='round'; mCtx.lineJoin='round';
    mCtx.beginPath(); for(let i=0;i<=waypoints.length;i++){ const p=waypoints[i%waypoints.length]; if(i===0) mCtx.moveTo(tx(p[0]),ty(p[1])); else mCtx.lineTo(tx(p[0]),ty(p[1])); } mCtx.stroke();
    for(const c of cars){
      mCtx.fillStyle = c.isPlayer ? '#00f2ff' : c.color;
      mCtx.beginPath(); mCtx.arc(tx(c.x), ty(c.y), c.isPlayer?3:2, 0, Math.PI*2); mCtx.fill();
    }
  }

  function formatTime(ms){
    const m=Math.floor(ms/60000); const s=Math.floor((ms%60000)/1000); const cs=Math.floor((ms%1000)/10);
    return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  }

  let endTimer = null;
  function endGame(){
    gameState='finished';
    hud.style.display='none';
    gameoverCard.style.display='block';
    const sorted = [...cars].sort((a,b)=>{
      if(a.finished && b.finished) return a.finishTime - b.finishTime;
      if(a.finished) return -1;
      if(b.finished) return 1;
      return b.totalProgress - a.totalProgress;
    });
    const tbody = document.getElementById('lb-body');
    tbody.innerHTML='';
    let playerPos=0;
    sorted.forEach((c,i)=>{
      if(c.isPlayer) playerPos=i+1;
      const tr=document.createElement('tr'); if(c.isPlayer) tr.className='highlight-row';
      tr.innerHTML=`<td class="lb-pos">${i+1}</td><td>${c.name}</td><td class="lb-time">${c.bestLap===Infinity?'--':formatTime(c.bestLap)}</td>`;
      tbody.appendChild(tr);
    });
    const title = document.getElementById('go-title');
    const sub = document.getElementById('go-sub');
    if(playerPos===1){ title.textContent='Victory!'; sub.textContent='You dominated the circuit.'; }
    else if(playerPos<=3){ title.textContent='Podium Finish'; sub.textContent=`You placed ${playerPos}${playerPos===2?'nd':'rd'}. Solid driving!`; }
    else { title.textContent='Race Over'; sub.textContent=`You placed ${playerPos}th. Keep pushing!`; }
  }

  function loop(now){
    requestAnimationFrame(loop);
    if(gameState==='menu'){ return; }
    if(gameState==='racing') raceTime = performance.now() - raceStart;

    const player = cars[0];
    const cam = cameraFollow(player);

    let sx=0, sy=0;
    if(player && player.isPlayer && keys['Space'] && player.nitro>0){ shake=3; } else { shake *= 0.9; }
    if(shake>0.5){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }

    ctx.save();
    ctx.translate(-cam.x+sx, -cam.y+sy);

    drawTrack();

    cars.sort((a,b)=>a.y-b.y);
    for(const c of cars){
      c.update(16, raceTime);
      c.draw(ctx);
      if(Math.abs(c.speed)>2) spawnExhaust(c);
    }
    if(cars[0]!==player){ const idx=cars.indexOf(player); if(idx>0){ cars.splice(idx,1); cars.unshift(player); } }

    updateParticles();
    drawParticles();

    ctx.restore();

    if(gameState==='racing'){
      posVal.textContent = getPositionText();
      lapVal.textContent = `${Math.min(player.lap, TOTAL_LAPS)} / ${TOTAL_LAPS}`;
      speedVal.textContent = Math.abs(Math.round(player.speed*18));
      timeText.textContent = formatTime(raceTime);
      nitroBar.style.transform = `scaleX(${Math.max(0, player.nitro)})`;
    }

    drawMinimap();

    if(gameState==='countdown'){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold 120px Segoe UI, sans-serif';
      ctx.fillStyle='#ffffff'; ctx.fillText(countdown>0?countdown:'GO!', W/2, H/2);
      ctx.restore();
    }

    if(gameState==='racing'){
      const allDone = cars.every(c=>c.finished);
      if(player.finished || allDone){
        if(endTimer===null) endTimer=performance.now();
        if(performance.now()-endTimer>2000){ endGame(); endTimer=null; }
      } else { endTimer=null; }
    }
  }

  function getPositionText(){
    const sorted = [...cars].sort((a,b)=>{
      if(a.finished && b.finished) return a.finishTime - b.finishTime;
      if(a.finished) return -1;
      if(b.finished) return 1;
      return b.totalProgress - a.totalProgress;
    });
    const idx = sorted.findIndex(c=>c.isPlayer);
    const ord = idx+1;
    let suffix='th';
    if(ord===1) suffix='st'; else if(ord===2) suffix='nd'; else if(ord===3) suffix='rd';
    return `${ord}${suffix} / ${cars.length}`;
  }

  document.getElementById('start-btn').addEventListener('click', resetGame);
  document.getElementById('restart-btn').addEventListener('click', resetGame);

  requestAnimationFrame(loop);
})();
</script>
</body>
