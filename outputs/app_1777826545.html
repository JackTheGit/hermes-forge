<title>DrawPad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    gap: 12px;
    flex-wrap: wrap;
  }
  .app-title {
    font-size: 18px;
    font-weight: 700;
    color: #e94560;
    letter-spacing: 1px;
    margin-right: 12px;
  }
  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tool-btn {
    background: #0f3460;
    border: 2px solid transparent;
    color: #eaeaea;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 18px;
    padding: 0;
  }
  .tool-btn:hover { background: #1a4a7a; transform: translateY(-1px); }
  .tool-btn.active {
    border-color: #e94560;
    background: #1a4a7a;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px #e94560; }
  .color-picker-wrapper {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #555;
    cursor: pointer;
  }
  .color-picker-wrapper input[type="color"] {
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    padding: 0; border: none;
    cursor: pointer;
  }
  .size-slider {
    -webkit-appearance: none;
    width: 100px;
    height: 6px;
    border-radius: 3px;
    background: #0f3460;
    outline: none;
  }
  .size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e94560;
    cursor: pointer;
  }
  .size-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e94560;
    cursor: pointer;
    border: none;
  }
  .size-label {
    font-size: 12px;
    color: #aaa;
    min-width: 28px;
    text-align: center;
  }
  .action-btn {
    background: #e94560;
    border: none;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: #ff6b81; }
  .action-btn.secondary {
    background: #0f3460;
  }
  .action-btn.secondary:hover { background: #1a4a7a; }

  /* Canvas area */
  .canvas-area {
    flex: 1;

    background: #0f0f23;

    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #ffffff;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    cursor: crosshair;
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }

  /* Tooltip */
  .tool-btn[title] {
    position: relative;
  }
  .tool-btn[title]:hover::after {
    content: attr(title);
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }

  @media (max-width: 768px) {
    .topbar { padding: 8px 10px; gap: 8px; }
    .app-title { font-size: 14px; }
    .tool-btn { width: 34px; height: 34px; font-size: 16px; }

<body>
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="app-title">DrawPad</span>
      <div class="toolbar-group">
        <button class="tool-btn active" id="tool-brush" title="Brush">&#9998;</button>
        <button class="tool-btn" id="tool-eraser" title="Eraser">&#128396;</button>
        <button class="tool-btn" id="tool-line" title="Line">&#47;</button>
        <button class="tool-btn" id="tool-rect" title="Rectangle">&#9633;</button>
        <button class="tool-btn" id="tool-circle" title="Circle">&#9675;</button>
      </div>
      <div class="toolbar-group" id="color-palette">
        <div class="color-swatch active" style="background:#000000" data-color="#000000"></div>
        <div class="color-swatch" style="background:#e94560" data-color="#e94560"></div>
        <div class="color-swatch" style="background:#0f3460" data-color="#0f3460"></div>
        <div class="color-swatch" style="background:#16c79a" data-color="#16c79a"></div>
        <div class="color-swatch" style="background:#f9a825" data-color="#f9a825"></div>
        <div class="color-swatch" style="background:#7b1fa2" data-color="#7b1fa2"></div>
        <div class="color-picker-wrapper" title="Custom color">
          <input type="color" id="custom-color" value="#3498db">
        </div>
      </div>
      <div class="toolbar-group">
        <span class="size-label" id="size-val">4</span>
        <input type="range" class="size-slider" id="brush-size" min="1" max="50" value="4">
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="action-btn secondary" id="btn-undo" title="Undo">&#8617; Undo</button>
      <button class="action-btn secondary" id="btn-redo" title="Redo">&#8618; Redo</button>
      <button class="action-btn secondary" id="btn-clear" title="Clear">Clear</button>
      <button class="action-btn" id="btn-save" title="Save">Save</button>
    </div>
  </div>
  <div class="canvas-area" id="canvas-area">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvas-area');

  // State
  let tool = 'brush';
  let color = '#000000';
  let size = 4;
  let isDrawing = false;
  let startX = 0, startY = 0;
  let snapshot = null;

  // Undo/Redo stacks
  const undoStack = [];
  const redoStack = [];
  const MAX_HISTORY = 50;

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    const padding = 40;
    const w = Math.max(400, rect.width - padding);
    const h = Math.max(300, rect.height - padding);
    // Save content before resize
    let tempCanvas = null;
    if (canvas.width > 0 && canvas.height > 0) {
      tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
    }
    canvas.width = w;
    canvas.height = h;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Restore content
    if (tempCanvas) {
      ctx.drawImage(tempCanvas, 0, 0);
    }
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function saveState() {
    if (undoStack.length >= MAX_HISTORY) undoStack.shift();
    undoStack.push(canvas.toDataURL());
    redoStack.length = 0;
  }

  function restoreState(dataUrl) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = dataUrl;
  }

  // Drawing logic
  function startDraw(e) {
    if (e.button !== 0 && !e.touches) return;
    isDrawing = true;
    const pos = getPos(e);
    startX = pos.x;
    startY = pos.y;
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineWidth = size;

    if (tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
    }

    if (tool === 'brush' || tool === 'eraser') {
      ctx.lineTo(startX, startY);
      ctx.stroke();
    }
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);

    if (tool === 'brush' || tool === 'eraser') {
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } else {
      // Shapes: restore snapshot and draw preview
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      if (tool === 'line') {
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (tool === 'rect') {
        const w = pos.x - startX;
        const h = pos.y - startY;
        ctx.strokeRect(startX, startY, w, h);
      } else if (tool === 'circle') {
        const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
        ctx.arc(startX, startY, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function endDraw() {
    if (!isDrawing) return;
    isDrawing = false;
    ctx.globalCompositeOperation = 'source-over';
    saveState();
  }

  // Events
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  // Tools
  const tools = {
    'tool-brush': 'brush',
    'tool-eraser': 'eraser',
    'tool-line': 'line',
    'tool-rect': 'rect',
    'tool-circle': 'circle'
  };
  Object.keys(tools).forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      tool = tools[id];
    });
  });

  // Colors
  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach(swatch => {
    swatch.addEventListener('click', () => {
      swatches.forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      color = swatch.dataset.color;
      document.getElementById('custom-color').value = color;
    });
  });

  document.getElementById('custom-color').addEventListener('input', (e) => {
    color = e.target.value;
    swatches.forEach(s => s.classList.remove('active'));
  });

  // Size
  const sizeSlider = document.getElementById('brush-size');
  const sizeLabel = document.getElementById('size-val');
  sizeSlider.addEventListener('input', (e) => {
    size = parseInt(e.target.value);
    sizeLabel.textContent = size;
  });

  // Actions
  document.getElementById('btn-clear').addEventListener('click', () => {
    if (confirm('Clear the canvas?')) {
      saveState();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  });

  document.getElementById('btn-undo').addEventListener('click', () => {
    if (undoStack.length > 0) {
      const current = canvas.toDataURL();
      redoStack.push(current);
      const prev = undoStack.pop();
      restoreState(prev);
    }
  });

  document.getElementById('btn-redo').addEventListener('click', () => {
    if (redoStack.length > 0) {
      const current = canvas.toDataURL();
      undoStack.push(current);
      const next = redoStack.pop();
      restoreState(next);
    }
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'drawpad-' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      document.getElementById('btn-undo').click();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
      e.preventDefault();
      document.getElementById('btn-redo').click();
    }
  });

  // Initial blank state
  saveState();
})();
</script>
</body>
</html>
