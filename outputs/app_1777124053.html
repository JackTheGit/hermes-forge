<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Racing Game</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let width, height, roadWidth, roadLeft, laneWidth, carWidth, carHeight;
let state = 'MENU';
let lastTime = 0;
let roadOffset = 0;
let score = 0;
let spawnTimer = 0;

const keys = {};
const touchInput = { left: false, right: false, gas: false, brake: false };
const buttons = {};

const player = {
  x: 0, y: 0, speed: 0,
  maxSpeed: 900, accel: 500, brake: 700,
  steerSpeed: 450, width: 0, height: 0
};

let traffic = [];
let particles = [];
let scenery = [];

const trafficColors = ['#e53935','#1e88e5','#fdd835','#43a047','#8e24aa','#fb8c00'];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  roadWidth = Math.min(width * 0.9, 600);
  roadLeft = (width - roadWidth) / 2;
  laneWidth = roadWidth / 3;
  carWidth = laneWidth * 0.55;
  carHeight = carWidth * 1.7;
  player.width = carWidth;
  player.height = carHeight;
  player.y = height - 150;
  if (state === 'MENU') player.x = width / 2;

  buttons.left = { x: 80, y: height - 90, r: 50 };
  buttons.right = { x: width - 80, y: height - 90, r: 50 };
  buttons.gas = { x: width - 80, y: height - 190, r: 50 };
  buttons.brake = { x: 80, y: height - 190, r: 50 };
}
window.addEventListener('resize', resize);

function resetGame() {
  player.x = width / 2;
  player.speed = 0;
  score = 0;
  roadOffset = 0;
  spawnTimer = 0;
  traffic = [];
  particles = [];
  scenery = [];
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && (state === 'MENU' || state === 'CRASHED')) {
    resetGame();
    state = 'PLAYING';
  }
});
window.addEventListener('keyup', e => keys[e.key] = false);

function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = width / rect.width;
  const scaleY = height / rect.height;
  return {
    x: (touch.clientX - rect.left) * scaleX,
    y: (touch.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  let pressedButton = false;
  for (let t of e.changedTouches) {
    const pos = getTouchPos(t);
    for (let k in buttons) {
      const b = buttons[k];
      if (Math.hypot(pos.x - b.x, pos.y - b.y) < b.r) {
        touchInput[k] = true;
        pressedButton = true;
      }
    }
  }
  if (!pressedButton && (state === 'MENU' || state === 'CRASHED')) {
    resetGame();
    state = 'PLAYING';
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    const pos = getTouchPos(t);
    for (let k in buttons) {
      const b = buttons[k];
      if (Math.hypot(pos.x - b.x, pos.y - b.y) < b.r * 1.5) {
        touchInput[k] = false;
      }
    }
  }
});
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function shadeColor(color, percent) {
  let R = parseInt(color.substring(1, 3), 16);
  let G = parseInt(color.substring(3, 5), 16);
  let B = parseInt(color.substring(5, 7), 16);
  R = parseInt(R * (100 + percent) / 100);
  G = parseInt(G * (100 + percent) / 100);
  B = parseInt(B * (100 + percent) / 100);
  R = R < 255 ? R : 255;
  G = G < 255 ? G : 255;
  B = B < 255 ? B : 255;
  R = Math.round(R); G = Math.round(G); B = Math.round(B);
  const RR = (R.toString(16).length === 1 ? "0" + R.toString(16) : R.toString(16));
  const GG = (G.toString(16).length === 1 ? "0" + G.toString(16) : G.toString(16));
  const BB = (B.toString(16).length === 1 ? "0" + B.toString(16) : B.toString(16));
  return "#" + RR + GG + BB;
}

function rectIntersect(a, b) {
  return a.x - a.width / 2 < b.x + b.width / 2 &&
         a.x + a.width / 2 > b.x - b.width / 2 &&
         a.y - a.height / 2 < b.y + b.height / 2 &&
         a.y + a.height / 2 > b.y - b.height / 2;
}

function spawnTraffic() {
  const isSlow = Math.random() < 0.85;
  const lane = Math.floor(Math.random() * 3);
  const x = roadLeft + laneWidth * lane + laneWidth / 2;
  let y, speed;
  if (isSlow) {
    y = -carHeight * 1.5;
    speed = 120 + Math.random() * 220;
  } else {
    y = height + carHeight * 1.5;
    speed = player.speed + 180 + Math.random() * 180;
  }
  traffic.push({
    x, y, speed,
    width: carWidth,
    height: carHeight,
    color: trafficColors[Math.floor(Math.random() * trafficColors.length)]
  });
}

function spawnScenery() {
  if (Math.random() > 0.04) return;
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const margin = 25;
  let x;
  if (side === 'left') {
    x = Math.random() * (roadLeft - margin * 2) + margin;
  } else {
    x = roadLeft + roadWidth + margin + Math.random() * (width - roadLeft - roadWidth - margin * 2);
  }
  scenery.push({
    x, y: -60,
    r: 14 + Math.random() * 18,
    color: Math.random() < 0.5 ? '#2e7d32' : '#1b5e20'
  });
}

function createParticles(x, y) {
  for (let i = 0; i < 40; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 600,
      vy: (Math.random() - 0.5) * 600,
      life: 1.0,
      color: Math.random() > 0.3 ? '#ff5722' : '#ffeb3b',
      size: 3 + Math.random() * 5
    });
  }
}

function update(dt) {
  if (state === 'PLAYING') {
    if (keys.ArrowUp || keys.w || touchInput.gas) player.speed += player.accel * dt;
    if (keys.ArrowDown || keys.s || touchInput.brake) player.speed -= player.brake * dt;

    player.speed *= (1 - 1.2 * dt);
    if (player.speed < 0) player.speed = 0;
    if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;

    let steer = 0;
    if (keys.ArrowLeft || keys.a || touchInput.left) steer -= 1;
    if (keys.ArrowRight || keys.d || touchInput.right) steer += 1;
    const steerFactor = Math.min(player.speed / 150, 1);
    player.x += steer * player.steerSpeed * steerFactor * dt;

    if (player.x < roadLeft || player.x > roadLeft + roadWidth) {
      player.speed *= (1 - 5.0 * dt);
    }
    player.x = Math.max(roadLeft - carWidth, Math.min(roadLeft + roadWidth + carWidth, player.x));

    roadOffset = (roadOffset + player.speed * dt) % 120;
    score += player.speed * dt * 0.05;

    spawnTimer -= dt;
    if (spawnTimer <= 0 && player.speed > 50) {
      spawnTraffic();
      spawnTimer = Math.max(0.35, 1.4 - player.speed / 1000);
    }

    for (let i = traffic.length - 1; i >= 0; i--) {
      const car = traffic[i];
      car.y += (player.speed - car.speed) * dt;
      if (rectIntersect(player, car)) {
        state = 'CRASHED';
        createParticles((player.x + car.x) / 2, (player.y + car.y) / 2);
        player.speed = 0;
      }
      if (car.y > height + 300 || car.y < -400) {
        traffic.splice(i, 1);
      }
    }

    if (player.speed > 10) spawnScenery();
    for (let i = scenery.length - 1; i >= 0; i--) {
      scenery[i].y += player.speed * dt;
      if (scenery[i].y > height + 100) scenery.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.8;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawCar(ctx, x, y, w, h, color) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(4, 6, w / 2 + 3, h / 2 + 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = color;
  roundRect(ctx, -w / 2, -h / 2, w, h, 5);
  ctx.fill();

  ctx.fillStyle = shadeColor(color, -15);
  roundRect(ctx, -w / 2.8, -h / 5, w / 1.4, h / 2.5, 3);
  ctx.fill();

  ctx.fillStyle = '#81d4fa';
  ctx.fillRect(-w / 2 + 3, -h / 2 + 3, w - 6, h / 10);
  ctx.fillRect(-w / 2 + 3, h / 2 - h / 10 - 3, w - 6, h / 10);

  ctx.fillStyle = '#fff59d';
  ctx.fillRect(-w / 2 + 2, -h / 2 + 1, w / 4, 3);
  ctx.fillRect(w / 2 - w / 4 - 2, -h / 2 + 1, w / 4, 3);

  ctx.fillStyle = '#e53935';
  ctx.fillRect(-w / 2 + 2, h / 2 - 3, w / 4, 3);
  ctx.fillRect(w / 2 - w / 4 - 2, h / 2 - 3, w / 4, 3);

  ctx.fillStyle = '#212121';
  const ww = w / 5;
  const wh = h / 7;
  ctx.fillRect(-w / 2 - ww / 2, -h / 3, ww, wh);
  ctx.fillRect(w / 2 - ww / 2, -h / 3, ww, wh);
  ctx.fillRect(-w / 2 - ww / 2, h / 3 - wh, ww, wh);
  ctx.fillRect(w / 2 - ww / 2, h / 3 - wh, ww, wh);

  ctx.restore();
}

function drawRoad() {
  ctx.fillStyle = '#388e3c';
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = '#2e7d32';
  ctx.lineWidth = 2;
  const off = roadOffset % 40;
  for (let i = -off; i < height; i += 40) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(width, i);
    ctx.stroke();
  }

  ctx.fillStyle = '#424242';
  ctx.fillRect(roadLeft, 0, roadWidth, height);

  ctx.fillStyle = '#616161';
  ctx.fillRect(roadLeft - 8, 0, 8, height);
  ctx.fillRect(roadLeft + roadWidth, 0, 8, height);

  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.setLineDash([50, 50]);
  ctx.lineDashOffset = -roadOffset;

  ctx.beginPath();
  ctx.moveTo(roadLeft + laneWidth, 0);
  ctx.lineTo(roadLeft + laneWidth, height);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(roadLeft + laneWidth * 2, 0);
  ctx.lineTo(roadLeft + laneWidth * 2, height);
  ctx.stroke();

  ctx.setLineDash([]);

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(roadLeft, 0);
  ctx.lineTo(roadLeft, height);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(roadLeft + roadWidth, 0);
  ctx.lineTo(roadLeft + roadWidth, height);
  ctx.stroke();

  if (player.speed > 350) {
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    const sOff = (roadOffset * 2.5) % 80;
    for (let i = -sOff; i < height; i += 80) {
      for (let lane = 0; lane < 3; lane++) {
        ctx.beginPath();
        ctx.moveTo(roadLeft + laneWidth * lane + laneWidth * 0.25, i);
        ctx.lineTo(roadLeft + laneWidth * lane + laneWidth * 0.75, i);
        ctx.stroke();
      }
    }
  }
}

function drawScenery() {
  for (let s of scenery) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(s.x + 4, s.y + 4, s.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  for (let p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(10, 10, 220, 85);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('SPEED: ' + Math.floor(player.speed / 8) + ' mph', 20, 20);
  ctx.fillText('SCORE: ' + Math.floor(score), 20, 55);

  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) {
    ctx.globalAlpha = 0.25;
    for (let k in buttons) {
      const b = buttons[k];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = touchInput[k] ? '#fff' : '#000';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = touchInput[k] ? '#000' : '#fff';
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let sym = '';
      if (k === 'left') sym = '◄';
      else if (k === 'right') sym = '►';
      else if (k === 'gas') sym = '▲';
      else if (k === 'brake') sym = '▼';
      ctx.fillText(sym, b.x, b.y);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, width, height);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 58px sans-serif';
  ctx.fillText('RACING GAME', width / 2, height / 2 - 90);

  ctx.font = '22px sans-serif';
  ctx.fillText('Arrow Keys or WASD to Drive', width / 2, height / 2 + 10);
  ctx.fillText('UP = Gas    DOWN = Brake', width / 2, height / 2 + 45);
  ctx.fillText('Press SPACE or TAP to Start', width / 2, height / 2 + 90);
}

function drawCrashed() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, width, height);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ff5252';
  ctx.font = 'bold 58px sans-serif';
  ctx.fillText('CRASHED!', width / 2, height / 2 - 70);

  ctx.fillStyle = '#fff';
  ctx.font = '28px sans-serif';
  ctx.fillText('Score: ' + Math.floor(score), width / 2, height / 2 + 10);
  ctx.font = '22px sans-serif';
  ctx.fillText('Press SPACE or TAP to Restart', width / 2, height / 2 + 65);
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  drawRoad();
  drawScenery();

  for (let car of traffic) {
    drawCar(ctx, car.x, car.y, car.width, car.height, car.color);
  }

  if (state !== 'CRASHED' || Math.floor(Date.now() / 120) % 2 === 0) {
    drawCar(ctx, player.x, player.y, player.width, player.height, '#d32f2f');
  }

  drawParticles();

  if (state === 'PLAYING' || state === 'CRASHED') {
    drawHUD();
  }

  if (state === 'MENU') drawMenu();
  else if (state === 'CRASHED') drawCrashed();
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
