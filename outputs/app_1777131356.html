         #toolbar {

     padding: 0 8px; border-right: 1px solid rgba(255,255,255,0.08); }

         .tool-btn {                                                            
           width: 40px; height: 40px; border-radius: 10px; border: 1px          
     solid transparent;                                                         
           background: rgba(255,255,255,0.06); color: #a0a8c9; cursor:

           display: flex; align-items: center; justify-content: center;         
     transition: all 0.15s;

         }                                                                      
         .tool-btn:hover { background: rgba(255,255,255,0.12); color: #fff;

           background: rgba(255,255,255,0.12); outline: none; flex-shrink:

         }                                                                      
         input[type="range"]::-webkit-slider-thumb {                            
           -webkit-appearance: none; width: 14px; height: 14px;                 
     border-radius: 50%;                                                        
           background: #e94560; cursor: pointer; border: 2px solid #fff;        
         }                                                                      
                                                                                
         .spacer { flex: 1; }                                                   
                                                                                
         #canvas-wrap {                                                         
           position: absolute; top: 64px; left: 0; right: 0; bottom: 0;         
           background: #fff; cursor: crosshair; overflow: hidden;               
         }                                                                      
         canvas { display: block; touch-action: none; }                         
                                                                                
         #cursor {                                                              
           position: absolute; pointer-events: none; border-radius: 50%;        
           border: 1.5px solid rgba(0,0,0,0.4); box-shadow: 0 0 0 1px           
     rgba(255,255,255,0.5);                                                     
           transform: translate(-50%, -50%); z-index: 50; display: none;        
         }                                                                      
                                                                                
         .tooltip {                                                             
           position: absolute; bottom: -28px; left: 50%; transform:             
     translateX(-50%);                                                          
           background: rgba(0,0,0,0.8); color: #fff; font-size: 11px;           
     padding: 4px 8px;                                                          
           border-radius: 6px; white-space: nowrap; opacity: 0;                 
     pointer-events: none;                                                      
           transition: opacity 0.15s;                                           
         }                                                                      
         .tool-btn:hover .tooltip { opacity: 1; }                               
                                                                                
         .icon-fill::before { content: "🪣"; font-size: 16px; }                 
       </style>                                                                 
     </head>                                                                    
     <body>

     18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11"

         <button class="tool-btn" data-tool="eraser" title="Eraser (E)">

       </div>

         <div class="color-swatch" style="background:#f39c12"

         <div class="color-swatch" style="background:#f1c40f"

       </div>

           <div class="tooltip">Undo</div>                                      
         </button>                                                              
         <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Y)">          
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"           
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path      
     d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21            
     13"/></svg>                                                                
           <div class="tooltip">Redo</div>                                      
         </button>                                                              
       </div>                                                                   
                                                                                
       <div class="tool-group">                                                 
         <button class="tool-btn" id="clear-btn" title="Clear (C)">             
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"           
     stroke-width="2" stroke-linecap="round"                                    
     stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19      
     6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2     
     2v2"/></svg>                                                               
           <div class="tooltip">Clear</div>                                     
         </button>                                                              
         <button class="tool-btn" id="save-btn" title="Save (Ctrl+S)">          
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"           
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path      
     d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2            
     2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7     
     8 15 8"/></svg>                                                            
           <div class="tooltip">Save</div>                                      
         </button>                                                              
       </div>                                                                   
     </div>                                                                     
                                                                                
     <div id="canvas-wrap">                                                     
       <canvas id="canvas"></canvas>                                            
       <div id="cursor"></div>                                                  
     </div>                                                                     
                                                                                
     <script>                                                                   
     (function() {                                                              
       const canvas = document.getElementById('canvas');                        
       const ctx = canvas.getContext('2d', { willReadFrequently: true });       
       const wrap = document.getElementById('canvas-wrap');                     
       const cursor = document.getElementById('cursor');                        
       const sizeDisplay = document.getElementById('size-display');             
       const sizeSlider = document.getElementById('size-slider');               
                                                                                
       let W, H;                                                                
       let drawing = false;                                                     
       let tool = 'brush';                                                      
       let color = '#e94560';                                                   
       let size = 4;                                                            
       let lastX, lastY;                                                        
       let undoStack = [];                                                      
       let redoStack = [];                                                      
       const MAX_HISTORY = 50;                                                  
                                                                                
       function resize() {                                                      
         const oldW = canvas.width;                                             
         const oldH = canvas.height;                                            
         const oldData = oldW ? ctx.getImageData(0, 0, oldW, oldH) : null;      
                                                                                
         W = wrap.clientWidth;                                                  
         H = wrap.clientHeight;                                                 
         const dpr = Math.min(window.devicePixelRatio || 1, 2);                 
         canvas.width = W  dpr;                                                 
         canvas.height = H  dpr;                                                
         canvas.style.width = W + 'px';                                         
         canvas.style.height = H + 'px';                                        
         ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                                
                                                                                
         ctx.fillStyle = '#ffffff';                                             
         ctx.fillRect(0, 0, W, H);                                              
                                                                                
         if (oldData) {                                                         
           ctx.putImageData(oldData, 0, 0);                                     
         }                                                                      
                                                                                
         saveState();                                                           
       }                                                                        
                                                                                
       function saveState() {                                                   
         if (undoStack.length >= MAX_HISTORY) undoStack.shift();                
         undoStack.push(ctx.getImageData(0, 0, canvas.width,                    
     canvas.height));                                                           
         redoStack = [];                                                        
       }                                                                        
                                                                                
       function undo() {                                                        
         if (undoStack.length <= 1) return;                                     
         redoStack.push(undoStack.pop());                                       
         const state = undoStack[undoStack.length - 1];                         
         ctx.putImageData(state, 0, 0);                                         
       }                                                                        
                                                                                
       function redo() {                                                        
         if (!redoStack.length) return;                                         
         const state = redoStack.pop();                                         
         undoStack.push(state);                                                 
         ctx.putImageData(state, 0, 0);                                         
       }                                                                        
                                                                                
       function getPos(e) {                                                     
         const rect = canvas.getBoundingClientRect();                           
         if (e.touches && e.touches.length) {                                   
           return { x: e.touches[0].clientX - rect.left, y:                     
     e.touches[0].clientY - rect.top };                                         
         }                                                                      
         return { x: e.clientX - rect.left, y: e.clientY - rect.top };          
       }                                                                        
                                                                                
       function startDraw(e) {                                                  
         if (e.button !== 0 && e.type === 'mousedown') return;                  
         e.preventDefault();                                                    
         drawing = true;                                                        
         const p = getPos(e);                                                   
         lastX = p.x; lastY = p.y;                                              
                                                                                
         if (tool === 'fill') {                                                 
           fillArea(Math.floor(p.x), Math.floor(p.y));                          
           drawing = false;                                                     
           return;                                                              
         }                                                                      
                                                                                
         ctx.beginPath();                                                       
         ctx.moveTo(p.x, p.y);                                                  
         ctx.lineTo(p.x + 0.01, p.y + 0.01);                                    
         ctx.stroke();                                                          
       }                                                                        
                                                                                
       function draw(e) {                                                       
         e.preventDefault();                                                    
         const p = getPos(e);                                                   
                                                                                
         cursor.style.left = p.x + 'px';                                        
         cursor.style.top = p.y + 'px';                                         
                                                                                
         if (!drawing) return;                                                  
                                                                                
         ctx.lineWidth = size;                                                  
         ctx.lineCap = 'round';                                                 
         ctx.lineJoin = 'round';                                                
                                                                                
         if (tool === 'brush') {                                                
           ctx.globalCompositeOperation = 'source-over';                        
           ctx.strokeStyle = color;                                             
         } else if (tool === 'eraser') {                                        
           ctx.globalCompositeOperation = 'destination-out';                    
           ctx.strokeStyle = 'rgba(0,0,0,1)';                                   
         }                                                                      
                                                                                
         ctx.beginPath();                                                       
         ctx.moveTo(lastX, lastY);                                              
         ctx.lineTo(p.x, p.y);                                                  
         ctx.stroke();                                                          
                                                                                
         lastX = p.x;                                                           
         lastY = p.y;                                                           
       }                                                                        
                                                                                
       function endDraw() {                                                     
         if (!drawing) return;                                                  
         drawing = false;                                                       
         ctx.beginPath();                                                       
         saveState();                                                           
       }                                                                        
                                                                                
       function fillArea(startX, startY) {                                      
         const dpr = Math.min(window.devicePixelRatio || 1, 2);                 
         const x = Math.floor(startX  dpr);                                     
         const y = Math.floor(startY  dpr);                                     
                                                                                
         const imgData = ctx.getImageData(0, 0, canvas.width,                   
     canvas.height);                                                            
         const data = imgData.data;                                             
         const w = canvas.width;                                                
         const h = canvas.height;                                               
                                                                                
         if (x < 0 || y < 0 || x >= w || y >= h) return;                        
                                                                                
         const targetIdx = (y  w + x)  4;                                       
         const tr = data[targetIdx], tg = data[targetIdx+1], tb =               
     data[targetIdx+2], ta = data[targetIdx+3];                                 
                                                                                
         const hexToRgb = (hex) => {                                            
           const n = parseInt(hex.slice(1), 16);                                
           return [(n >> 16) & 255, (n >> 8) & 255, n & 255];                   
         };                                                                     
         const [fr, fg, fb] = hexToRgb(color);                                  
         const fa = 255;                                                        
                                                                                
         if (tr === fr && tg === fg && tb === fb && ta === fa) return;          
                                                                                
         const match = (i) => data[i] === tr && data[i+1] === tg &&             
     data[i+2] === tb && data[i+3] === ta;                                      
         const set = (i) => { data[i] = fr; data[i+1] = fg; data[i+2] = fb;     
     data[i+3] = fa; };                                                         
                                                                                
         const stack = [[x, y]];                                                
         while (stack.length) {                                                 
           const [cx, cy] = stack.pop();                                        
           if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;                
           const i = (cy  w + cx) * 4;                                          
           if (!match(i)) continue;                                             
           set(i);                                                              
           stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);          
         }                                                                      
                                                                                
         ctx.putImageData(imgData, 0, 0);                                       
         saveState();                                                           
       }                                                                        
                                                                                
       function setCursor() {                                                   
         cursor.style.width = size + 'px';                                      
         cursor.style.height = size + 'px';                                     
         if (tool === 'eraser') {                                               
           cursor.style.borderColor = 'rgba(0,0,0,0.6)';                        
           cursor.style.background = 'rgba(255,255,255,0.3)';                   
         } else {                                                               
           cursor.style.borderColor = 'rgba(0,0,0,0.4)';                        
           cursor.style.background = color;                                     
         }                                                                      
       }                                                                        
                                                                                
       function updateToolUI() {                                                
         document.querySelectorAll('[data-tool]').forEach(btn => {              
           btn.classList.toggle('active', btn.dataset.tool === tool);           
         });                                                                    
       }                                                                        
                                                                                
       function setColor(c) {                                                   
         color = c;                                                             
         setCursor();                                                           
       }                                                                        
                                                                                
       // Events                                                                
       canvas.addEventListener('mousedown', startDraw);                         
       canvas.addEventListener('mousemove', draw);                              
       window.addEventListener('mouseup', endDraw);                             
                                                                                
       canvas.addEventListener('touchstart', startDraw, { passive: false        
     });                                                                        
       canvas.addEventListener('touchmove', draw, { passive: false });          
       window.addEventListener('touchend', endDraw);                            
                                                                                
       canvas.addEventListener('mouseenter', () => cursor.style.display =       
     'block');                                                                  
       canvas.addEventListener('mouseleave', () => cursor.style.display =       
     'none');                                                                   
                                                                                
       document.querySelectorAll('[data-tool]').forEach(btn => {                
         btn.addEventListener('click', () => {                                  
           tool = btn.dataset.tool;                                             
           updateToolUI();                                                      
           setCursor();                                                         
         });                                                                    
       });                                                                      
                                                                                
       document.querySelectorAll('.color-swatch').forEach(sw => {               
         sw.addEventListener('click', () => {                                   
           if (sw.querySelector('input')) return;                               
           document.querySelectorAll('.color-swatch').forEach(s =>              
     s.classList.remove('active'));                                             
           sw.classList.add('active');                                          
           setColor(sw.dataset.color);                                          
         });                                                                    
       });                                                                      
                                                                                
       document.getElementById('custom-color').addEventListener('input',        
     (e) => {                                                                   
         document.querySelectorAll('.color-swatch').forEach(s =>                
     s.classList.remove('active'));                                             
         e.target.parentElement.classList.add('active');                        
         setColor(e.target.value);                                              
       });                                                                      
                                                                                
       sizeSlider.addEventListener('input', (e) => {                            
         size = parseInt(e.target.value);                                       
         sizeDisplay.textContent = size + 'px';                                 
         setCursor();                                                           
       });                                                                      
                                                                                
       document.getElementById('undo-btn').addEventListener('click', undo);     
       document.getElementById('redo-btn').addEventListener('click', redo);     
                                                                                
       document.getElementById('clear-btn').addEventListener('click', () =>     
     {                                                                          
         ctx.globalCompositeOperation = 'source-over';                          
         ctx.fillStyle = '#ffffff';                                             
         ctx.fillRect(0, 0, W, H);                                              
         saveState();                                                           
       });                                                                      
                                                                                
       document.getElementById('save-btn').addEventListener('click', () =>      
     {                                                                          
         const link = document.createElement('a');                              
         link.download = 'drawing-' + new                                       
     Date().toISOString().slice(0,19).replace(/:/g,'-') + '.png';               
         link.href = canvas.toDataURL('image/png');                             
         link.click();                                                          
       });                                                                      
                                                                                
       document.addEventListener('keydown', (e) => {                            
         if (e.ctrlKey || e.metaKey) {                                          
           if (e.key === 'z') { e.preventDefault(); undo(); }                   
           if (e.key === 'y') { e.preventDefault(); redo(); }                   
           if (e.key === 's') { e.preventDefault();                             
     document.getElementById('save-btn').click(); }                             
         } else {                                                               
           if (e.key === 'b') { tool = 'brush'; updateToolUI();                 
     setCursor(); }                                                             
           if (e.key === 'e') { tool = 'eraser'; updateToolUI();                
     setCursor(); }                                                             
           if (e.key === 'f') { tool = 'fill'; updateToolUI(); setCursor();     
     }                                                                          
           if (e.key === 'c') {                                                 
     document.getElementById('clear-btn').click(); }                            
         }                                                                      
       });                                                                      
                                                                                
       window.addEventListener('resize', resize);                               
                                                                                
       resize();                                                                
       setCursor();                                                             
     })();                                                                      
     </script>                                                                  
                                                                                
     </body>
